name: Package and deterministic evaluations
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optional spreadsheet parser for XLSX regression tests
        run: python -m pip install 'openpyxl>=3.1.5,<4'
      - run: npm run check
      - run: npm test
      - run: npm run eval
      - run: npm pack --dry-run
      - name: Evaluate supplied reviewed host trajectories
        run: python3 scripts/evaluate_trajectory.py --directory evals/host-traces
